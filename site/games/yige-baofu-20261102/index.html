<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#151c24">
<title>一格暴富 · 连锁经营实验</title>
<style>
:root{color-scheme:dark;--ink:#f8f3df;--sub:#aeb9b9;--bg:#141c22;--glass:#202b32;--stroke:#40535b;--gold:#ffd27d;--green:#8ae0ae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#31504b 0,#18272a 45%,#111a21 90%);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;opacity:.14;pointer-events:none;background-image:radial-gradient(#c4f1c7 1px, transparent 1px);background-size:18px 18px}
.app{position:relative;width:min(100%,505px);padding:14px 14px 22px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:11px}
header{display:flex;justify-content:space-between;align-items:center;gap:9px}.brand{display:flex;align-items:center;gap:9px}.logo{width:37px;height:37px;display:grid;place-items:center;font-size:24px;border-radius:11px;background:linear-gradient(145deg,#d0af68,#986943);box-shadow:0 4px 0 #644735,inset 0 2px 1px #ffdda4}.brandtext{line-height:1.1}.brandtext strong{font-size:22px;letter-spacing:1.1px;font-weight:900}.brandtext small{display:block;color:#b2c8bb;font-size:10px;letter-spacing:1.5px;margin-top:4px}.tools{display:flex;gap:5px}.iconbtn{border:1px solid #40545b;border-radius:11px;background:#22323b;color:#edebdd;min-width:35px;height:35px;font-size:16px;cursor:pointer}.iconbtn:active{transform:translateY(1px)}
.stats{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:7px}.stat{border:1px solid #45605d;background:linear-gradient(180deg,#2a4040e8,#203137db);padding:8px 10px;border-radius:12px;min-width:0;box-shadow:0 4px 13px #0002}.stat span{display:block;color:#bad0c5;font-size:10px;margin-bottom:3px}.stat b{font-size:21px;line-height:1.12;font-variant-numeric:tabular-nums}.stat b small{font-size:11px;color:#a8bdc0}.stat:nth-child(2) b{color:var(--gold)}.stat:nth-child(3) b{color:#94edb1}
.progress{height:7px;background:#1a282c;border-radius:40px;overflow:hidden;border:1px solid #394a44}.progress>div{height:100%;width:0%;background:linear-gradient(90deg,#93bf90,#ffe4a0);box-shadow:0 0 8px #ffec99;transition:width .5s}
.event{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid #675b44;background:linear-gradient(90deg,#3f3c30,#293636);border-radius:11px;min-height:42px}.event .eventicon{font-size:24px}.event .eventtext{flex:1;min-width:0}.event b{font-size:12px;display:block;color:#fff0bc}.event small{display:block;color:#d5d4be;font-size:10px;margin-top:2px}.event .daytag{font-size:10px;color:#d6d2bd;background:#ffffff17;padding:5px 7px;border-radius:7px}
.board-shell{position:relative;padding:8px;background:linear-gradient(140deg,#2b554f,#18382f);border:2px solid #6b9276;border-radius:17px;box-shadow:inset 0 0 0 2px #17372e,0 6px 0 #102e28,0 15px 24px #0006;touch-action:manipulation}.board-head{display:flex;justify-content:space-between;padding:0 7px 7px;color:#cbe0bd;font-size:10px;letter-spacing:1px}.board-head b{color:#f9e6b5}.board-wrap{position:relative;aspect-ratio:1;width:100%;background:#6a9a77;border-radius:8px;overflow:hidden;cursor:crosshair;box-shadow:inset 0 2px 8px #0003}#world{display:block;width:100%;height:100%;touch-action:manipulation}
.notice{position:absolute;top:48px;left:50%;transform:translateX(-50%) translateY(-10px);max-width:90%;min-width:180px;pointer-events:none;background:#192b30e8;border:1px solid #c6bb80;color:#ffedb6;border-radius:11px;padding:9px 14px;text-align:center;font-weight:800;font-size:12px;line-height:1.4;opacity:0;transition:opacity .2s, transform .2s;z-index:3}.notice.on{opacity:1;transform:translateX(-50%) translateY(0)}
.status{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:12px;min-height:24px;color:#d6e7d9}.status strong{color:#fce3a0}.status .right{font-size:11px;color:#b7c8c4}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{min-width:0;position:relative;border:2px solid #556767;border-bottom:5px solid #34483f;background:linear-gradient(168deg,#344a48,#233437);border-radius:14px;color:#eff9e8;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 6px 7px;min-height:107px;box-shadow:inset 0 1px #ffffff16;transition:transform .14s,border-color .14s}.card.selected{border-color:#f0c974;background:linear-gradient(160deg,#59644e,#354b43);transform:translateY(-4px);box-shadow:0 6px 16px #0005,0 0 0 1px #f5d89044}.card:disabled{opacity:.48;filter:saturate(.5)}.card .cardart{height:34px;width:42px;display:grid;place-items:center}.card .name{font-size:13px;font-weight:800}.card .meta{font-size:10px;color:#bbcabc;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.card .cost{position:absolute;top:6px;right:6px;font-size:10px;color:#ffdf92;border-radius:7px;background:#0005;padding:2px 5px}.card .tipdot{position:absolute;top:5px;left:5px;font-size:10px;color:#b0f6d7}
.actions{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:8px}.action{border:1px solid #58746d;border-bottom:3px solid #364e46;background:#29423f;border-radius:11px;color:#e8eee1;font-size:12px;padding:9px 5px;min-height:43px;cursor:pointer;font-weight:750}.action:disabled{opacity:.4;cursor:not-allowed}.action.primary{background:linear-gradient(180deg,#edc97e,#b48d55);border:1px solid #f4d69d;border-bottom:3px solid #906733;color:#33281b}.action.secondary{background:#24373c}.hint{text-align:center;color:#abc6ba;font-size:10px;line-height:1.5;min-height:18px}
.overlay{position:fixed;inset:0;background:#0a161be8;backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,425px);max-height:90dvh;overflow:auto;border-radius:21px;padding:23px 20px 19px;background:linear-gradient(160deg,#31524e,#21363d 72%);border:2px solid #8fac86;box-shadow:0 18px 50px #000b,inset 0 2px #ffffff18;text-align:center}.modal .seal{font-size:43px;margin-bottom:6px}.modal h2{font-size:26px;margin:4px 0 10px;color:#ffe3a3}.modal p{color:#d1e2d2;font-size:13px;line-height:1.85;margin:8px auto 13px}.modal .big{font-size:31px;font-weight:900;color:#ffdea1}.stepbox{background:#172b2d8a;border:1px solid #5e7a6b;text-align:left;border-radius:12px;padding:12px 13px;margin:12px auto;font-size:12px;color:#e9f0db;line-height:1.9}.stepbox strong{color:#ffe39c}.modalbutton{display:block;margin:13px auto 0;width:100%;border:none;border-radius:12px;background:linear-gradient(180deg,#fbe5a0,#d7a75b);color:#48351c;padding:14px;font-size:16px;font-weight:900;box-shadow:0 4px #956c38;cursor:pointer}.modalbutton:active{transform:translateY(3px);box-shadow:0 1px #956c38}.modal .smallbtn{margin-top:12px;background:transparent;border:0;color:#bbd6c8;font-size:12px;cursor:pointer;padding:8px}
.pick3{display:grid;grid-template-columns:1fr;gap:8px;margin-top:13px}.pick{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #718a7b;background:#2b4943;color:#eef0d5;border-radius:12px;padding:11px 12px;cursor:pointer}.pick .emoji{font-size:26px}.pick b{display:block;font-size:13px;color:#ffe6af}.pick small{font-size:11px;line-height:1.6;color:#c8dad0}.pick:active{background:#456453}
.footnote{font-size:10px;color:#b4c9bf;text-align:center;margin-top:1px}
@media(max-height:780px){.app{gap:8px;padding-top:10px}.card{min-height:93px;padding:5px 4px}.card .cardart{height:27px}.status{font-size:11px}.event{padding:7px 9px;min-height:36px}.stats .stat{padding:6px 9px}.stat b{font-size:19px}.board-shell{padding:7px}}
@media(min-width:700px){body{display:flex;justify-content:center}.app{border-left:1px solid #536a5a44;border-right:1px solid #536a5a44}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">✦</div><div class="brandtext"><strong>一格暴富</strong><small>ONE TILE TYCOON · 试玩版</small></div></div><div class="tools"><button class="iconbtn" id="sound" title="声音">♫</button><button class="iconbtn" id="help" title="游戏说明">?</button><button class="iconbtn" id="reset" title="重新开始">↻</button></div></header>
<div class="stats"><div class="stat"><span>第几天</span><b id="day">1 <small>/ 18</small></b></div><div class="stat"><span>手头金币</span><b id="coins">34</b></div><div class="stat"><span>累计营业额</span><b id="income">0</b></div></div>
<div class="progress"><div id="progress"></div></div>
<div class="event"><span class="eventicon" id="eventicon">☀</span><div class="eventtext"><b id="eventname">晴空万里</b><small id="eventdesc">一切照常营业</small></div><span class="daytag" id="goal">目标 ¥360</span></div>
<div class="board-shell"><div class="board-head"><span>✦ 麻雀街 · 5×5</span><span id="boardscore">开张收入 <b>¥5</b>/天</span></div><div class="board-wrap"><canvas id="world" width="600" height="600" aria-label="游戏地图，点击空白格放置建筑"></canvas><div class="notice" id="notice"></div></div></div>
<div class="status"><span id="status">选择建筑，点击空地就能开工</span><span class="right" id="chain">▸ 田 → 厨房 → 商店</span></div>
<div class="cards" id="cards"></div>
<div class="actions"><button class="action secondary" id="reroll">↻ 换一批 ¥4</button><button class="action secondary" id="upgrade">⬆ 升级建筑</button><button class="action primary" id="skip">⏭ 休息一天</button></div>
<div class="hint" id="hint">靠近摆放才会自动送货；点击已有建筑可以升级。</div>
<div class="footnote">一次摆放 = 一天营业 · 18天造出自己的印钞小镇</div>
</div>
<div class="overlay" id="overlay" style="display:none"><div class="modal" id="modalcontent"></div></div>
<script>
(()=>{'use strict';
const N=5,MAX=18,GOAL=360;
const DEF={farm:{name:'菜田',icon:'🥕',cost:8,desc:'产出原料',color:'#92c77d'},kitchen:{name:'厨房',icon:'🍳',cost:12,desc:'原料→料理',color:'#f2a46b'},shop:{name:'食堂',icon:'🏮',cost:14,desc:'料理→金币',color:'#efc873'},well:{name:'水井',icon:'💧',cost:10,desc:'邻近菜田+1产量',color:'#83c7dc'},power:{name:'炉火',icon:'🔥',cost:14,desc:'邻近厨房+1产能',color:'#f47b66'},park:{name:'花园',icon:'🌼',cost:12,desc:'邻近食堂加价',color:'#bba5e8'},courier:{name:'驿站',icon:'📦',cost:14,desc:'隔一格也能送货',color:'#b9e3b5'}};
const EVENTS=[{icon:'☀',name:'晴空万里',desc:'一切照常营业',effect:'normal'}, {icon:'🌧',name:'及时雨',desc:'所有菜田额外产出 1 份',effect:'rain'}, {icon:'🎪',name:'夜市狂欢',desc:'每份料理售价 +3',effect:'festival'}, {icon:'🥵',name:'热浪来袭',desc:'没有水井照顾的菜田减产',effect:'drought'}, {icon:'✨',name:'探店爆红',desc:'连锁食堂每份额外 +2',effect:'trend'}, {icon:'🧨',name:'限时大单',desc:'每家食堂本日多卖 1 份',effect:'rush'}, {icon:'🌁',name:'停电一小时',desc:'没有炉火的厨房少做 1 份',effect:'blackout'}];
const PERKS=[{id:'harvest',icon:'🥬',title:'丰收计划',desc:'全部菜田永久 +1 产量'},{id:'taste',icon:'🍯',title:'秘制酱汁',desc:'每份料理永久多卖 ¥2'},{id:'delivery',icon:'🛵',title:'跑腿联盟',desc:'供货建筑的送货距离扩大到 2 格'},{id:'power',icon:'🧑‍🍳',title:'高效后厨',desc:'全部厨房永久 +1 产能'},{id:'park',icon:'🎠',title:'花园经济',desc:'每座花园对相邻食堂再额外 +2 售价'},{id:'shops',icon:'🤝',title:'联盟商铺',desc:'相邻食堂不再竞争，反而每家 +2 售价'}];
const $=id=>document.getElementById(id), canvas=$('world'),ctx=canvas.getContext('2d'), CW=600, PAD=23,CELL=(CW-2*PAD)/N;
let board=[], day=1,coins=34, total=0,selected=0, selectedTile=-1,offer=[],event=EVENTS[0], perks=[],hist=[],particles=[],floaters=[],shake=0,lastCash=5,ended=false, mute=false,noticeTimer=0,actionBusy=false,actT=0, animFrame=0, flashCells=[],hover=-1,roundSales=0;
let audio;
const random=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const pos=i=>[i%N,Math.floor(i/N)], ix=(x,y)=>y*N+x, valid=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const neighbors=i=>{let [x,y]=pos(i);return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>valid(a,b)).map(([a,b])=>ix(a,b))};
const dist=(a,b)=>{let [x,y]=pos(a),[X,Y]=pos(b);return Math.abs(x-X)+Math.abs(y-Y)};
const has=id=>perks.includes(id);
function play(t){if(mute)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let freq=t==='coin'?650:t==='bad'?170:t==='select'?400:t==='upgrade'?590:t==='sell'?880:320;let osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;osc.type=t==='coin'?'sine':'triangle';osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(80,freq*(t==='bad'?.6:1.35)),now+.1);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.065,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+.15);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.17)}catch(e){}}
function notify(txt){$('notice').textContent=txt;$('notice').classList.add('on');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('on'),1550)}
function shuffleCards(){const pool=['farm','farm','kitchen','kitchen','shop','shop','well','park','power',...(day>=4?['courier','courier']:[])];offer=Array.from({length:3},()=>pick(pool));if(day<=3){offer=['farm','kitchen','shop'];}if(selected<0||selected>2)selected=0;renderCards()}
function init(){board=Array(N*N).fill(null);board[ix(1,2)]={type:'farm',lvl:1};board[ix(2,2)]={type:'kitchen',lvl:1};board[ix(3,2)]={type:'shop',lvl:1};day=1;coins=34;total=0;lastCash=5;selected=0;selectedTile=-1;event=EVENTS[0];perks=[];particles=[];floaters=[];hist=[];ended=false;actionBusy=false;flashCells=[];hover=-1;shuffleCards();updateUI();showStart()}
function getNear(i,type,arr=board){return neighbors(i).filter(j=>arr[j]?.type===type)}
function canLink(i,j,arr=board){if(dist(i,j)===1)return true;if(has('delivery')&&dist(i,j)<=2)return true;return arr.some((b,k)=>b?.type==='courier'&&dist(i,k)===1&&dist(k,j)===1)}
function sourcesFor(i,type,arr=board){return arr.map((b,j)=>b?.type===type&&canLink(i,j,arr)?j:-1).filter(x=>x!==-1).sort((a,b)=>dist(i,a)-dist(i,b))}
function simulate(arr=board,ev=event,visual=false){let stocks=Array(N*N).fill(0),foods=Array(N*N).fill(0),origins=Array.from({length:N*N},()=>[]),trails=[],sales=0,items=0,activeShops=0,straightUnits=0;let outputPerShop={};
  for(let i=0;i<arr.length;i++){let b=arr[i];if(!b||b.type!=='farm')continue;let wells=getNear(i,'well',arr).length;let prod=b.lvl+wells+(has('harvest')?1:0)+(ev.effect==='rain'?1:0);if(ev.effect==='drought'&&wells===0)prod=Math.max(0,prod-1);stocks[i]=prod;}
  for(let i=0;i<arr.length;i++){let b=arr[i];if(!b||b.type!=='kitchen')continue;let powered=getNear(i,'power',arr).length;let cap=2*b.lvl+powered+(has('power')?1:0);if(ev.effect==='blackout'&&powered===0)cap=Math.max(0,cap-1);let farmList=sourcesFor(i,'farm',arr);for(let j of farmList){if(cap<=0)break;let used=Math.min(cap,stocks[j]);if(used>0){foods[i]+=used;stocks[j]-=used;cap-=used;for(let k=0;k<used;k++){origins[i].push(j);trails.push({a:j,b:i,type:'veg',step:.05+k*.06});}}}}
  for(let i=0;i<arr.length;i++){let b=arr[i];if(!b||b.type!=='shop')continue;let gardens=getNear(i,'park',arr).length;let nearbyShops=getNear(i,'shop',arr).length;let price=6+gardens*(3+(has('park')?2:0))+(has('taste')?2:0)+(ev.effect==='festival'?3:0)+(ev.effect==='trend'&&nearbyShops?2:0)+ (has('shops')?nearbyShops*2:-nearbyShops);price=Math.max(2,price);let cap=2*b.lvl+(ev.effect==='rush'?1:0);let ovens=sourcesFor(i,'kitchen',arr),delivered=0,bonus=0;
  for(let j of ovens){if(cap<=0)break;let used=Math.min(cap,foods[j]);if(used>0){foods[j]-=used;cap-=used;delivered+=used;for(let k=0;k<used;k++){
     let farm=origins[j].shift();if(farm!==undefined&&dist(farm,j)===1&&dist(j,i)===1){let [fx,fy]=pos(farm),[jx,jy]=pos(j),[sx,sy]=pos(i);if(jx-fx===sx-jx&&jy-fy===sy-jy){bonus+=2;straightUnits++}}
     trails.push({a:j,b:i,type:'dish',step:.28+k*.04});
  }}}
  let amount=delivered*price+bonus;sales+=amount;items+=delivered;if(delivered)activeShops++;outputPerShop[i]=amount;if(visual&&amount){floaters.push({idx:i,text:'+'+amount,born:performance.now(),color:'#ffe7a5'})}}
  let alliance=activeShops>=2?Math.floor(sales*.2):0;sales+=alliance;
  if(visual&&alliance>0)floaters.push({idx:12,text:'双店连锁 +'+alliance,born:performance.now()+120,color:'#d9ffb5'});
  return {sales,items,trails,stocks,foods,outputPerShop,activeShops,straightUnits,alliance};
}
function eventAt(d){if(d<=2)return EVENTS[0];const cycle=[0,2,1,0,4,3,2,6,1,0,5,4,3,1,2,6,5,0];return EVENTS[cycle[(d-1)%cycle.length]]}
function refreshEstimate(){let res=simulate();$('boardscore').innerHTML=`开张预计 <b>¥${res.sales}</b>/天`;$('chain').textContent=`▸ ${res.straightUnits?`直线加成×${res.straightUnits} · `:""}预计卖${res.items}份`}
function updateUI(){if(day>MAX)return;$('day').innerHTML=day+` <small>/ ${MAX}</small>`;$('coins').textContent='¥'+coins;$('income').textContent='¥'+total;$('progress').style.width=Math.min(100,total/GOAL*100)+'%';$('eventicon').textContent=event.icon;$('eventname').textContent=event.name;$('eventdesc').textContent=event.desc;$('goal').textContent='目标 ¥'+GOAL;refreshEstimate();$('reroll').disabled=coins<4||ended||actionBusy;let b=board[selectedTile],cost=b?upgradeCost(b):0;$('upgrade').disabled=!b||cost>coins||b.lvl>=3||ended||actionBusy;$('upgrade').innerHTML=b?`⬆ 升级 ¥${b.lvl>=3?'满':cost}`:'⬆ 升级建筑';$('skip').disabled=ended||actionBusy;renderCards();let msg=selectedTile>=0&&b?`${DEF[b.type].icon} ${DEF[b.type].name} Lv.${b.lvl} · ${b.lvl<3?`升级只要 ¥${cost}`:'已满级'}`:`放下「${DEF[offer[selected]].name}」，小镇就营业一天`;$('status').innerHTML=msg;$('hint').textContent=selectedTile>=0?'升级会消耗一天营业机会；点击空地切回建造。':'菜田 → 厨房 → 食堂，邻接才能送货；井、炉火、花园会产生增益。'}
function renderCards(){const el=$('cards');el.innerHTML='';offer.forEach((key,i)=>{let d=DEF[key];let btn=document.createElement('button');btn.className='card'+(selected===i&&selectedTile<0?' selected':'');btn.disabled=coins<d.cost||ended||actionBusy;btn.innerHTML=`<span class="cost">¥${d.cost}</span><span class="cardart" style="font-size:31px;filter:drop-shadow(0 3px 0 #0005)">${d.icon}</span><span class="name">${d.name}</span><span class="meta">${d.desc}</span>`;btn.addEventListener('click',()=>{selected=i;selectedTile=-1;play('select');updateUI()});el.appendChild(btn)})}
function upgradeCost(b){return 10+b.lvl*11+(b.type==='shop'?3:0)}
function activate(i){if(ended||actionBusy)return;if(board[i]){selectedTile=i;selected=-1;play('select');updateUI();return;}selectedTile=-1;if(selected<0)selected=0;let type=offer[selected],cost=DEF[type].cost;if(cost>coins){notify('金币不够啦！');play('bad');return;}coins-=cost;board[i]={type,lvl:1};spawnBurst(i,DEF[type].color,18);shake=3;play('select');doTurn('建成 '+DEF[type].name,i)}
function doTurn(prefix,i=-1){if(ended)return;actionBusy=true;const result=simulate(board,event,true);roundSales=result.sales;lastCash=result.sales;coins+=result.sales;total+=result.sales;actT=performance.now();hist=result.trails.map(t=>({...t,born:actT,ends:actT+850}));if(result.sales){play('coin');notify(`${prefix}！今日赚到 ¥${result.sales}`)}else{play('bad');notify(`${prefix}，但生产链还没连起来！`)}
  if(result.items>=4&&Math.random()<.5)spawnBurst(i<0?12:i,'#ffda73',16);
  updateUI();setTimeout(()=>{day++;actionBusy=false;selectedTile=-1;selected=0;hist=[];
    if(day>MAX){finish();return;}
    event=eventAt(day);shuffleCards();updateUI();
    if(day===6||day===12){showPerk();return;}
    if(day===3)notify('好消息：明天开始会出现天气变化！');
    if(day===4)notify('新蓝图：驿站可以帮你隔格运输');
  },1080)}
function showPerk(){const candidates=PERKS.filter(p=>!has(p.id)).sort(()=>Math.random()-.5).slice(0,3);$('overlay').style.display='flex';$('modalcontent').innerHTML=`<div class="seal">🎁</div><h2>小镇升级啦！</h2><p>选一个永久生效的新规则，后续的玩法会因此改变。</p><div class="pick3" id="perks"></div>`;let box=$('perks');for(let p of candidates){let btn=document.createElement('button');btn.className='pick';btn.innerHTML=`<span class="emoji">${p.icon}</span><span><b>${p.title}</b><small>${p.desc}</small></span>`;btn.onclick=()=>{perks.push(p.id);$('overlay').style.display='none';spawnBurst(12,'#ffe4a0',28);play('upgrade');updateUI();notify('解锁 '+p.title+'！')};box.appendChild(btn)}}
function finish(){ended=true;let win=total>=GOAL;let rank=total>=850?'传说营业王':total>=520?'街头大亨':total>=GOAL?'经营高手':total>=200?'潜力新星':'创业萌新';$('overlay').style.display='flex';$('modalcontent').innerHTML=`<div class="seal">${win?'🏆':'🌙'}</div><h2>${win?'小镇发财啦！':'18天营业结束'}</h2><p>累计营业额</p><div class="big">¥${total}</div><p>${rank} · 共解锁 ${perks.length} 个永久规则<br>最后一天营业收入 <b>¥${lastCash}</b>。</p><div class="stepbox"><strong>这局不同的地方：</strong><br>菜田、厨房、食堂要接通供货链；连续直线和双店经营都有额外加成。水井、炉火、花园及随机天气会改变最优布局。</div><button class="modalbutton" id="again">再玩一局 ↻</button>`;$('again').onclick=()=>{$('overlay').style.display='none';init()};play(win?'upgrade':'bad');updateUI()}
function showStart(){let el=$('overlay');el.style.display='flex';$('modalcontent').innerHTML=`<div class="seal">🏘️</div><h2>一格暴富</h2><p>18天，把一条小破街变成自动赚钱机器！<br>每次只需 <b>选建筑 → 点格子</b>。</p><div class="stepbox"><strong>① 菜田 🥕 → 厨房 🍳 → 食堂 🏮</strong><br>三者连在一起就会自动赚钱。排成直线还有额外奖金！<br><strong>② 水井 💧、炉火 🔥、花园 🌼</strong><br>邻近摆放会强化整条生产链。<br><strong>③ 每放一栋 = 营业一天</strong><br>有天气突变、技术抉择、连锁升级。18天挑战营业额 ¥${GOAL}。</div><button class="modalbutton" id="start">开门营业！</button><button class="smallbtn" id="rules">游戏目标不是放得多，而是连锁设计得巧。</button>`;$('start').onclick=()=>{el.style.display='none';play('select')};$('rules').onclick=()=>{el.style.display='none';play('select')}}
function showHelp(){let el=$('overlay');el.style.display='flex';$('modalcontent').innerHTML=`<div class="seal">📒</div><h2>连锁营业指南</h2><div class="stepbox"><strong>生产链</strong><br>🥕 菜田：每天生产 Lv. 数量的食材。<br>🍳 厨房：把附近菜田的原料做成料理，每天最多做 Lv.×2 份。<br>🏮 食堂：出售附近厨房的料理，每天最多卖 Lv.×2 份，每份基础 ¥6。<br><strong>增强器</strong><br>💧 水井：周围菜田产量 +1。<br>🔥 炉火：周围厨房产能 +1。<br>🌼 花园：周围食堂每份售价 +¥3。<br>📦 驿站：摆在中间，让距离两格的建筑也能送货。<br><strong>技巧</strong><br>同一个菜田可给多间厨房供货，但不会凭空复制原料。<strong>菜田→厨房→食堂如果排成连续直线，每份额外赚 ¥2。</strong>如果两家食堂同时营业，当天营业额 +20%。点击旧建筑可升级；没有合适位置也能休息一天。</div><button class="modalbutton" id="closehelp">继续营业</button>`;$('closehelp').onclick=()=>el.style.display='none'}
function spawnBurst(i,color,num=12){let [x,y]=pos(Math.max(0,i));let cx=PAD+x*CELL+CELL/2,cy=PAD+y*CELL+CELL/2;for(let j=0;j<num;j++){let t=Math.random()*Math.PI*2,vel=random(1,3.2);particles.push({x:cx,y:cy,vx:Math.cos(t)*vel,vy:Math.sin(t)*vel-1.3,life:random(20,35),max:35,color,size:random(2,5)})}}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function line(x1,y1,x2,y2,color,w=3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function ellipse(x,y,rx,ry,col){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()}
function drawSprite(type,x,y,s,lv=1,time=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let bob=Math.sin(time/460+x*.1)*1.1;ctx.translate(0,bob);ctx.lineJoin='round';ctx.lineWidth=2;
 if(type==='farm'){
  ellipse(0,17,26,9,'#3b7443');rr(-26,3,52,16,4,'#925b3d','#674d34');for(let t=-1;t<=1;t++){ellipse(t*15,10,7,5,'#bd8852');line(t*15,10,t*15-2,-7,'#2b814c',3);ellipse(t*15-9,-8,11,6,'#50a45b');ellipse(t*15+5,-14,11,6,'#66b95d');ellipse(t*15,-16,9,6,'#8ece6a');ellipse(t*15+1,-18,3,2,'#e1ed9d')}
 }else if(type==='kitchen'){
  rr(-25,-9,50,36,6,'#ead4a4','#946d54');rr(-25,6,50,13,2,'#d68b68');rr(-28,-18,56,15,3,'#b76d56','#815148');rr(-10,-27,21,19,3,'#6d7d79','#4b5353');rr(-5,-23,11,11,2,'#ccdad0');rr(-10,8,20,19,3,'#724a43','#4e3736');ellipse(0,16,4,4,'#f7d8a8');ctx.globalAlpha=.5;ellipse(5+Math.sin(time/310)*3,-35-Math.sin(time/420)*3,6,9,'#f4e6db');ctx.globalAlpha=1;
 }else if(type==='shop'){
  rr(-25,-13,50,42,5,'#f4dbb2','#a86f57');rr(-24,5,48,9,2,'#ca866d');rr(-13,12,26,16,2,'#86ac9b','#62827c');rr(-29,-20,58,15,4,'#c65e61','#953e48');for(let k=0;k<5;k++)rr(-25+k*10,-18,9,12,2,k%2?'#f6dbb4':'#cc6e65');rr(-8,-29,16,10,3,'#f9d491');line(0,-29,0,-35,'#a05c3c',2);
 }else if(type==='well'){
  ellipse(0,15,26,11,'#4e7b69');rr(-23,-3,46,27,5,'#bdb7a1','#89928a');ellipse(0,-1,23,12,'#8a8c81');ellipse(0,-4,17,8,'#6fbfd0');ellipse(4,-6,7,3,'#b9f3ed');line(-19,-8,-19,-32,'#8b644d',4);line(19,-8,19,-32,'#8b644d',4);line(-25,-30,25,-30,'#b07955',6);rr(-6,-29,12,12,2,'#9b705b');
 }else if(type==='power'){
  rr(-23,1,46,28,6,'#b08b7c','#7d635a');rr(-25,-8,50,14,4,'#58545d');rr(-16,2,32,20,3,'#5d4345');ellipse(0,12,12,9,'#eea34f');ellipse(0,10+Math.sin(time/150)*3,7,14,'#ffcc5c');ellipse(0,12,3,7,'#fff2ae');rr(14,-29,10,25,2,'#75636a');ellipse(17,-37-Math.sin(time/600)*3,8,7,'#c0b0a4');
 }else if(type==='park'){
  ellipse(0,18,26,10,'#548c63');rr(-22,8,45,12,5,'#94b873');for(let k=0;k<5;k++){let xx=(k-2)*10,yy=k%2?-10:2;line(xx,yy+9,xx,yy-8,'#4b8656',2);ellipse(xx,yy-9,6,6,k%2?'#e7b2c2':'#fae6a4');ellipse(xx,yy-9,2,2,'#a97b74')}ellipse(0,-19,14,16,'#5aab74');ellipse(-10,-21,10,11,'#88c58e');ellipse(8,-27,10,12,'#a2d27b');
 }else if(type==='courier'){
  rr(-25,-3,50,29,5,'#c5a279','#85654b');rr(-27,-11,54,13,3,'#829da1','#607e83');rr(-11,5,22,22,2,'#735d59');rr(-6,8,12,11,1,'#b7a17a');rr(12,5,9,8,2,'#e6c49d');line(-11,26,-11,32,'#775443',4);line(11,26,11,32,'#775443',4);ellipse(-20,22,7,7,'#e7b76e');
 }
 for(let n=0;n<lv-1;n++){ellipse(-21+n*13,-28,5,5,'#ffe08a');ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#805b2b';ctx.fillText('★',-21+n*13,-28)}
 ctx.restore();}
function drawMap(time){ctx.clearRect(0,0,CW,CW);ctx.fillStyle='#76a67d';ctx.fillRect(0,0,CW,CW);
 let cell=CELL;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
   let i=ix(x,y),px=PAD+x*cell,py=PAD+y*cell,isSel=i===selectedTile;let shade=(x*3+y*5)%4;
   rr(px+1,py+5,cell-3,cell-5,8,'#476d52');rr(px+1,py+1,cell-3,cell-8,8,['#94be83','#97c58e','#9dc389','#95b885'][shade],isSel?'#fff0ae':'#8bad7b');
   for(let k=0;k<5;k++){let sx=px+9+(k*19+x*7+y*3)%(cell-18),sy=py+11+(k*31+y*11)%(cell-23);line(sx,sy,sx+2,sy-3,'#aed398',1.4)}
   if(!board[i]&&hover===i){rr(px+3,py+3,cell-8,cell-11,8,'#ffffff25','#fff3b6')}
   if(board[i]){let b=board[i],cx=px+cell/2,cy=py+cell/2;
     ellipse(cx,cy+24,cell*.3,11,'#1d453855');
     if(isSel)rr(px+3,py+3,cell-8,cell-11,8,'#ffedaa20','#ffec9b');
     drawSprite(b.type,cx,cy,cell/83,b.lvl,time);
     if(b.lvl>1){rr(px+6,py+5,26,15,5,'#25443bcf');ctx.fillStyle='#fff0af';ctx.font='bold 11px sans-serif';ctx.fillText('L'+b.lvl,px+10,py+16)}
   }else if(selected>=0&&!actionBusy&&coins>=DEF[offer[selected]].cost&&hover===i){ctx.save();ctx.globalAlpha=.5;drawSprite(offer[selected],px+cell/2,py+cell/2,cell/83,1,time);ctx.restore()}
 }
 // subtle animated ambient glints
 for(let k=0;k<6;k++){let px=((k*137+61)%CW),py=((k*83+71)%CW),tw=.4+Math.sin(time/500+k*3)*.2;ellipse(px,py,1.1+tw,1.1+tw,'#effde08a')}
 if(hist.length){for(let h of hist){let t=(time-h.born)/850-h.step;if(t<0||t>1)continue;let [aX,aY]=pos(h.a),[bX,bY]=pos(h.b);let x1=PAD+(aX+.5)*cell,y1=PAD+(aY+.5)*cell,x2=PAD+(bX+.5)*cell,y2=PAD+(bY+.5)*cell;let t2=t*t*(3-2*t);line(x1,y1,x2,y2,h.type==='dish'?'#ffd98f88':'#a0e1a688',2);ellipse(x1+(x2-x1)*t2,y1+(y2-y1)*t2-10*Math.sin(t*Math.PI),h.type==='dish'?7:5,h.type==='dish'?7:5,h.type==='dish'?'#ffd38c':'#6d9e4b');ellipse(x1+(x2-x1)*t2-2,y1+(y2-y1)*t2-3-10*Math.sin(t*Math.PI),2,2,'#fff4c4')}}
 for(let k=particles.length-1;k>=0;k--){let p=particles[k];p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.life--;ctx.globalAlpha=Math.max(0,p.life/p.max);ellipse(p.x,p.y,p.size,p.size,p.color);ctx.globalAlpha=1;if(p.life<=0)particles.splice(k,1)}
 for(let k=floaters.length-1;k>=0;k--){let p=floaters[k],a=(time-p.born)/1000;if(a>1){floaters.splice(k,1);continue}let [xx,yy]=pos(p.idx);ctx.globalAlpha=1-a;ctx.textAlign='center';ctx.font='bold 18px sans-serif';ctx.strokeStyle='#39513e';ctx.lineWidth=4;ctx.strokeText(p.text,PAD+(xx+.5)*cell,PAD+(yy+.15)*cell-a*30);ctx.fillStyle=p.color;ctx.fillText(p.text,PAD+(xx+.5)*cell,PAD+(yy+.15)*cell-a*30);ctx.globalAlpha=1}
 if(shake>0)shake*=.78;
}
function draw(time){drawMap(time);animFrame=requestAnimationFrame(draw)}
function cellFromEvent(e){let r=canvas.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*CW,y=(e.clientY-r.top)/r.height*CW;let gx=Math.floor((x-PAD)/CELL),gy=Math.floor((y-PAD)/CELL);return valid(gx,gy)?ix(gx,gy):-1}
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;hover=cellFromEvent(e)});canvas.addEventListener('pointerleave',()=>hover=-1);canvas.addEventListener('pointerup',e=>{let i=cellFromEvent(e);if(i>=0)activate(i)});
$('reroll').onclick=()=>{if(coins<4||ended||actionBusy)return;coins-=4;selected=0;selectedTile=-1;shuffleCards();play('select');updateUI();notify('新图纸到了！')};
$('upgrade').onclick=()=>{let b=board[selectedTile];if(!b||ended||actionBusy||b.lvl>=3)return;let cost=upgradeCost(b);if(coins<cost){notify('金币不足');return;}coins-=cost;b.lvl++;spawnBurst(selectedTile,'#ffe59c',24);play('upgrade');doTurn('升级成功',selectedTile)};
$('skip').onclick=()=>{if(ended||actionBusy)return;play('select');doTurn('休息一天')};
$('help').onclick=showHelp;$('reset').onclick=()=>{if(confirm('确定重新开始这一局吗？'))init()};$('sound').onclick=()=>{mute=!mute;$('sound').textContent=mute?'♩':'♫';if(!mute)play('select')};
init();requestAnimationFrame(draw);
})();
</script>
